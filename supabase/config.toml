# Supabase local dev config. Only non-default values; the CLI fills the rest.
project_id = "strength-tracker"

[db.seed]
enabled = true
sql_paths = ["./seed/exercises.generated.sql", "./seed/exercises.curated.sql"]

[auth]
site_url = "https://coltbradley.github.io/strength-tracker/"
additional_redirect_urls = [
  "https://coltbradley.github.io/strength-tracker/",
  "http://localhost:5173",
]

# Code-only sign-in email ({{ .Token }}, no link): links are useless inside
# an installed iOS PWA (they open in Safari, whose storage the app can't
# see), and a 6-digit code is less clunky everywhere else too. Custom
# templates require custom SMTP on free tier; SMTP creds come from the
# environment (see .env.local, gitignored) so nothing personal lives in this
# public repo. Apply with: scripts/push-auth-config.sh
[auth.email.template.magic_link]
subject = "Strength Log sign-in code"
content_path = "./supabase/templates/magic_link.html"

# AgentMail rather than a personal Gmail. Sign-in codes are transactional mail
# and should not ride on someone's own mailbox: a Gmail app password is a
# credential to that whole account, the sender is a human being's address, and
# Google's send limits are shaped for a person rather than for an app.
#
# Two things about AgentMail that constrain what may be set here:
#
#   1. The From address MUST match the inbox being authenticated as, so
#      SMTP_USER is the sender and admin_email is not free to differ.
#   2. Port 587 rejects AUTH issued before STARTTLS with a 538, so an SMTP
#      client that authenticates eagerly must use 465 (implicit TLS) instead.
#      587 is kept here because it is what Supabase's sender does and what the
#      previous Gmail config used; if sign-in mail starts failing with 538,
#      that is the one line to change.
#
# USE A DEDICATED INBOX. Not a.lupin@agentmail.to: that is a listening address
# subscribed to campaign mailing lists, and the workspace's own account notes
# say never to use it for transactional sends. Its deliverability reputation is
# also the wrong one to hang sign-in codes on, and a friend receiving a login
# code from an unfamiliar research alias reads it as phishing.
[auth.email.smtp]
enabled = true
host = "smtp.agentmail.to"
port = 587
user = "env(SMTP_USER)"
pass = "env(SMTP_PASS)"
admin_email = "env(SMTP_USER)"
sender_name = "Strength Log"

# MCP server does its own bearer-token auth; the gateway must not demand a
# Supabase JWT. Deploy with --no-verify-jwt as well.
[functions.mcp-server]
verify_jwt = false

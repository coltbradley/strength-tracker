name: ci

on:
  push:
    branches: [main]
  pull_request:
  # GitHub has silently dropped push events for this repo before —
  # manual dispatch is the recovery path
  workflow_dispatch:

jobs:
  database:
    name: migrations + views + RLS (PGlite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build-exercise-seed.mjs
      - run: npm --prefix scripts ci
      - run: node scripts/validate-db.mjs
      # Every column the code SELECTs must exist. get_program shipped reading
      # programs.starts_on, which has never existed: it typechecks (PostgREST
      # select strings are just strings) and only fails when that one tool is
      # actually called.
      - run: node scripts/check-selects.mjs

  mcp-server:
    name: edge function typecheck + tests (deno)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check index.ts
        working-directory: supabase/functions/mcp-server
      # --allow-env/--allow-net for protocol.test.ts: it sets the auth env vars
      # it needs and points SUPABASE_URL at a closed port to exercise the
      # token-store-unreachable path. It makes no outbound request that can
      # succeed, and never contacts a real project.
      - run: deno test --allow-env --allow-net lib/
        working-directory: supabase/functions/mcp-server
      # The coach is the second edge function and was checked by nothing. It
      # changed in three of the ten commits before this step existed, it calls
      # the Anthropic SDK and the MCP connector, and a type error in it is only
      # discovered by a person waiting on an answer that never comes.
      - run: deno check index.ts
        working-directory: supabase/functions/coach

  pwa:
    name: pwa build + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pwa/package-lock.json
      - run: npm ci
        working-directory: pwa
      - run: npm run build
        working-directory: pwa
      - run: npm test -- --run
        working-directory: pwa

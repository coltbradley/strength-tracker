name: deploy

# Every push to main that touches the PWA redeploys GitHub Pages. The
# installed app does NOT reload itself to get it: registerType is "prompt", so
# main.tsx applies a waiting worker only when no session is open and otherwise
# defers to the next time the app is hidden. A mid-set reload would take the
# staged reps and any half-typed note. Expect a lifter on the new build at
# their next visit, not seconds after the push.
#
# This publishes the CLIENT ONLY. Migrations (`supabase db push`) and both edge
# functions (`supabase functions deploy mcp-server --no-verify-jwt`, `supabase
# functions deploy coach`) are still by hand — see docs/deploy.md. Nothing here
# sequences them, so shipping a build that reads a column whose migration has
# not been pushed breaks that read for everyone until someone runs it.
#
# Deploys never touch user data: training data lives in Postgres, and
# device-local IndexedDB/localStorage survive service worker updates untouched.

on:
  push:
    branches: [main]
    paths: ["pwa/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pwa/package-lock.json
      - run: npm ci
        working-directory: pwa
      - run: npm run build
        working-directory: pwa
        env:
          PAGES_BASE: /strength-tracker/
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          # Not a secret: a Sentry DSN is write-only and ships in the client
          # bundle by design, so it lives here rather than in secrets. On a
          # public repo anyone can read it and post events, so the project
          # caps this key at 1000 events/hour; allowed domains are set in the
          # Sentry project's Security & Privacy settings.
          VITE_SENTRY_DSN: https://fc68a697d5ac1c02ab435cdddf18677e@o4512002739601408.ingest.us.sentry.io/4512002743730176
          # The build stamp the About row and every bug report quote. Without
          # these a report says "0.1.0" for every build ever shipped.
          VITE_APP_VERSION: ${{ github.ref_name }}
          VITE_BUILD_SHA: ${{ github.sha }}
          VITE_BUILD_TIME: ${{ github.event.repository.updated_at }}
      - run: npm test -- --run
        working-directory: pwa
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: pwa/dist
          commit_message: "Deploy PWA (${{ github.sha }})"

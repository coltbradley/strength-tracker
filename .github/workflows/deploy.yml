name: deploy

# Every push to main deploys what changed, in the order the schema needs.
#
# Three jobs. `changes` looks at the diff. `supabase` pushes migrations and
# edge functions when anything under supabase/ changed. If those paths
# changed and the three deploy settings are missing, the job FAILS so Pages
# cannot publish a client against a schema/function set that did not go out.
# If supabase/ did not change, the job is skipped and Pages may still publish.
# There is no wait on `ci.yml`: GitHub Actions CI billing currently fails that
# workflow automatically, and a release must not wait on a job that cannot run.
#
# The installed app does NOT reload itself to pick up a Pages build: registerType
# is "prompt", so main.tsx applies a waiting worker only when no session is open
# and otherwise defers to the next time the app is hidden. A mid-set reload
# would take the staged reps and any half-typed note. Expect a lifter on the
# new build at their next visit, not seconds after the push.
#
# Deploys never touch user data: training data lives in Postgres, migrations are
# append-only, and device-local IndexedDB/localStorage survive service worker
# updates untouched.

on:
  push:
    branches: [main]
    paths: ["pwa/**", "supabase/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  # never cancel a run that may be mid `db push`; the next one queues behind it
  cancel-in-progress: false

jobs:
  changes:
    name: what changed
    runs-on: ubuntu-latest
    outputs:
      pwa: ${{ steps.filter.outputs.pwa }}
      supabase: ${{ steps.filter.outputs.supabase }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          # workflow_dispatch, a first push, or a force-push whose old head is
          # gone: no honest diff exists, so treat everything as changed.
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            echo "pwa=true" >> "$GITHUB_OUTPUT"
            echo "supabase=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$BEFORE" "$AFTER")
          if echo "$changed" | grep -qE '^(pwa/|\.github/workflows/deploy\.yml$)'; then p=true; else p=false; fi
          if echo "$changed" | grep -qE '^supabase/'; then s=true; else s=false; fi
          echo "pwa=$p" >> "$GITHUB_OUTPUT"
          echo "supabase=$s" >> "$GITHUB_OUTPUT"
          echo "pwa changed: $p · supabase changed: $s"

  supabase:
    name: migrations + edge functions
    needs: changes
    if: needs.changes.outputs.supabase == 'true'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      # `secrets` cannot be read in an `if:`, so the gate is a shell step that
      # turns "are all three set" into an output the later steps can test.
      - id: gate
        shell: bash
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$SUPABASE_DB_PASSWORD" ] && [ -n "$SUPABASE_PROJECT_REF" ]; then
            echo "on=true" >> "$GITHUB_OUTPUT"
          else
            echo "on=false" >> "$GITHUB_OUTPUT"
            echo "::error title=Supabase deploy blocked::SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD (repository secrets) and SUPABASE_PROJECT_REF (repository variable) are not all set. A change under supabase/ cannot publish without them — docs/deploy.md."
            exit 1
          fi
      - if: steps.gate.outputs.on == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - if: steps.gate.outputs.on == 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      # Only migrations the remote has not seen. Never edits an applied one.
      - if: steps.gate.outputs.on == 'true'
        run: supabase db push
      # --no-verify-jwt on mcp-server every deploy: it does its own bearer auth
      # and the gateway must not demand a Supabase JWT. The coach is the
      # opposite on purpose: its caller has a session, so the gateway SHOULD.
      - if: steps.gate.outputs.on == 'true'
        run: supabase functions deploy mcp-server --no-verify-jwt
      - if: steps.gate.outputs.on == 'true'
        run: supabase functions deploy coach
      # Same shape as the coach: the caller has a session, so verify_jwt stays on.
      #
      # push-alerts has ONE route that is not acting for a signed-in person --
      # /sweep, called by pg_cron with a shared secret -- and it authenticates
      # itself before the session check rather than turning verify_jwt off for
      # the whole function. Deploying this with --no-verify-jwt would open
      # subscribe, schedule and cancel to anyone with the URL.
      - if: steps.gate.outputs.on == 'true'
        run: supabase functions deploy push-alerts
      # Endurance sync. Session-authenticated like the coach; the per-user
      # provider credentials live in integration_credentials (service role
      # only), not in this function's environment, so there is no secret to set
      # here and nothing breaks when a user has no source connected.
      - if: steps.gate.outputs.on == 'true'
        run: supabase functions deploy endurance-sync

  pages:
    name: publish PWA
    needs: [changes, supabase]
    # always() so a SKIPPED supabase job (nothing under supabase/ changed) does
    # not skip this one too; the explicit result checks keep a failed or
    # cancelled db push in front of the client build.
    if: >-
      always()
      && needs.changes.outputs.pwa == 'true'
      && needs.supabase.result != 'failure'
      && needs.supabase.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pwa/package-lock.json
      - run: npm ci
        working-directory: pwa
      - run: node scripts/check-pwa-env.mjs
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      - run: npm run build
        working-directory: pwa
        env:
          PAGES_BASE: /strength-tracker/
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          # Not a secret: a Sentry DSN is write-only and ships in the client
          # bundle by design, so it lives here rather than in secrets. On a
          # public repo anyone can read it and post events, so the project
          # caps this key at 1000 events/hour; allowed domains are set in the
          # Sentry project's Security & Privacy settings.
          VITE_SENTRY_DSN: https://fc68a697d5ac1c02ab435cdddf18677e@o4512002739601408.ingest.us.sentry.io/4512002743730176
          # The build stamp the About row and every bug report quote. Without
          # these a report says "0.1.0" for every build ever shipped.
          VITE_APP_VERSION: ${{ github.ref_name }}
          VITE_BUILD_SHA: ${{ github.sha }}
          VITE_BUILD_TIME: ${{ github.event.repository.updated_at }}
      - run: npm test -- --run
        working-directory: pwa
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: pwa/dist
          commit_message: "Deploy PWA (${{ github.sha }})"
      - name: smoke
        env:
          PAGES_URL: ${{ vars.PAGES_URL }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          pages_url="${PAGES_URL:-https://coltbradley.github.io/strength-tracker/}"
          pages_code=$(curl -sS -o /tmp/pages-body -w '%{http_code}' "$pages_url")
          echo "pages_http=$pages_code"
          if [ "$pages_code" != "200" ]; then
            echo "::error::Pages smoke failed ($pages_code)"
            exit 1
          fi
          mcp_code=skipped
          if [ -n "${SUPABASE_PROJECT_REF:-}" ]; then
            mcp_url="https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/mcp-server/health"
            mcp_code=$(curl -sS -o /tmp/mcp-health -w '%{http_code}' "$mcp_url")
            echo "mcp_http=$mcp_code"
            if [ "$mcp_code" != "200" ]; then
              echo "::error::MCP /health smoke failed ($mcp_code)"
              exit 1
            fi
          else
            echo "MCP smoke skipped: SUPABASE_PROJECT_REF unset"
          fi
          echo "receipt sha=${{ github.sha }} run=${{ github.run_id }} supabase_job=${{ needs.supabase.result }} pages_http=$pages_code mcp_http=$mcp_code"
